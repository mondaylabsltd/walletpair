name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  extension:
    name: Extension (check + test + vectors + Chrome/Firefox builds)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: walletpair-extension
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Type / Svelte check
        run: pnpm check
      - name: Test (unit, properties, conformance vectors)
        run: pnpm test
      - name: Test vectors are reproducible from viem
        run: npx tsx test/vectors/generate.ts && git diff --exit-code -- ../spec/test-vectors
      - name: Build Chrome MV3
        run: pnpm build
      - name: Build Firefox
        run: pnpm build:firefox

  website:
    name: Website (check + build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: walletpair.org
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Type / Svelte check
        run: pnpm check
      - name: Build (wrangler types + vite build)
        run: pnpm build
